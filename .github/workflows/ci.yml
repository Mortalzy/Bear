name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Switch to npm ci once the generated lockfile has been reviewed and committed.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
