# Include from nginx's http context, e.g. /etc/nginx/sites-enabled/bear.conf.
# Replace bear.example.ru and /var/www/bear with the real domain and checkout.
limit_req_zone $binary_remote_addr zone=bear_api_ip:10m rate=5r/s;
limit_req_zone $server_name zone=bear_api_total:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=bear_connections:10m;

server {
  listen 80;
  listen [::]:80;
  server_name bear.example.ru;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    try_files $uri =404;
  }

  location / {
    return 301 https://bear.example.ru$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name bear.example.ru;

  ssl_certificate /etc/letsencrypt/live/bear.example.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bear.example.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /var/www/bear/client/dist;
  index index.html;
  server_tokens off;

  # 200 MB of files plus 1 MB for multipart headers and form fields.
  client_max_body_size 201000000;
  client_header_timeout 15s;
  client_body_timeout 30s;
  keepalive_timeout 15s;
  send_timeout 30s;
  limit_conn bear_connections 30;
  limit_conn_status 429;
  limit_req_status 429;

  add_header Strict-Transport-Security "max-age=2592000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

  location /api/ {
    limit_req zone=bear_api_ip burst=10 nodelay;
    limit_req zone=bear_api_total burst=20 nodelay;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append an untrusted incoming X-Forwarded-For.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    # Receive and bound the body in Nginx before occupying an Express upload slot.
    proxy_request_buffering on;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
  }

  location = /api {
    return 404;
  }

  location /assets/ {
    expires 7d;
    try_files $uri =404;
  }

  location /images/ {
    expires 1h;
    try_files $uri =404;
  }

  location ~ /\. {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
